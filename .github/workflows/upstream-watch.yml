name: Upstream Watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/upstream-watch.yml

permissions:
  contents: read

concurrency:
  group: upstream-watch-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: palmier-io/palmier-pro
  GPL_SOURCE_TAG: last-gpl-source
  GPL_SOURCE_COMMIT: 8805801fa4df8bc2dbc57cb0a854a1f5108f95c6

jobs:
  check:
    name: Verify final GPL source baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify published GPL boundary and integration
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "refs/tags/${GPL_SOURCE_TAG}:refs/remotes/upstream/gpl-source"
          published_commit="$(git rev-parse 'refs/remotes/upstream/gpl-source^{commit}')"
          if [[ "$published_commit" != "$GPL_SOURCE_COMMIT" ]]; then
            echo "::error::The published GPL source tag changed. Review its provenance before updating the pinned commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GPL_SOURCE_COMMIT" HEAD; then
            echo "::error::This branch does not contain the final published GPL source commit."
            exit 1
          fi
          echo "Final published GPL source is integrated. Later proprietary release metadata is not merged."
