name: BYOK Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "ongrow/**"

concurrency:
  group: byok-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ad-hoc DMG
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: .build
          key: byok-preview-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: byok-preview-${{ runner.os }}-

      - name: Build preview DMG
        run: scripts/package-byok-preview.sh

      - name: Upload preview DMG
        uses: actions/upload-artifact@v5
        with:
          name: PalmierPro-BYOK-Preview-${{ github.sha }}
          path: .build/PalmierPro-BYOK-Preview.dmg
          if-no-files-found: error
          retention-days: 14
